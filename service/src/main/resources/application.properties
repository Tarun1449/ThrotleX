spring.application.name=throttlex


spring.datasource.url=jdbc:postgresql://localhost:5432/throttlex
spring.datasource.username=throttlex
spring.datasource.password=throttlex
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

management.endpoints.web.exposure.include=health,info,metrics


# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.database=0
spring.data.redis.timeout=500ms
spring.data.redis.connect-timeout=500ms
spring.data.redis.client-type=lettuce

# Lettuce Connection Pool
spring.data.redis.lettuce.pool.enabled=true
spring.data.redis.lettuce.pool.max-active=16
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=2
spring.data.redis.lettuce.pool.max-wait=500ms
spring.data.redis.lettuce.pool.time-between-eviction-runs=30s

# Graceful shutdown for Lettuce
spring.data.redis.lettuce.shutdown-timeout=100ms