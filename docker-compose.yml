services:
  # 1. Core Transactional Database (OLTP)
  postgres:
    image: postgres:16-alpine
    container_name: throttlex-postgres
    environment:
      POSTGRES_USER: throttlex_user
      POSTGRES_PASSWORD: throttlex_password
      POSTGRES_DB: throttlex_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  # 2. Caching & Rate Limiting Engine
  redis:
    image: redis:7-alpine
    container_name: throttlex-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  # 3. Message Broker (Analytics Pipeline) - using KRaft mode (No Zookeeper)
  kafka:
    image: apache/kafka:3.7.0
    container_name: throttlex-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      CLUSTER_ID: "5L6g3nShT-eMCtK--X86sw"
    ports:
      - "9094:9094"
    volumes:
      - kafka_data:/bitnami/kafka
    restart: unless-stopped

  # 4. Analytics Database (OLAP)
  clickhouse:
    image: clickhouse/clickhouse-server:latest-alpine
    container_name: throttlex-clickhouse
    ports:
      - "8123:8123"  # HTTP interface
      - "9000:9000"  # Native client interface
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    restart: unless-stopped

  # 5. ThrottleX Core API (Spring Boot)
  api:
    build: ./service
    container_name: throttlex-api
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:postgresql://throttlex-postgres:5432/throttlex_db
      - SPRING_DATASOURCE_USERNAME=throttlex_user
      - SPRING_DATASOURCE_PASSWORD=throttlex_password
      - SPRING_DATA_REDIS_HOST=throttlex-redis
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=throttlex-kafka:9092
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
      - kafka

  # 6. Observability: Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: throttlex-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    depends_on:
      - api
    restart: unless-stopped

  # 7. Observability: Grafana
  grafana:
    image: grafana/grafana:latest
    container_name: throttlex-grafana
    ports:
      - "3002:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_SECURITY_ADMIN_USER=admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/etc/grafana/dashboards
    depends_on:
      - prometheus
    restart: unless-stopped

  # 8. Frontend React Dashboard
  frontend:
    build: ./ui
    container_name: throttlex-frontend
    ports:
      - "3001:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:
  kafka_data:
  clickhouse_data:
  prometheus_data:
  grafana_data:
  redis_data:
